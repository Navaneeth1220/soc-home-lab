# The source override is required: the Splunk Add-on for Sysmon matches on
# source::XmlWinEventLog:Microsoft-Windows-Sysmon/Operational, but this forwarder
# version emitted source WinEventLog:Microsoft-Windows-Sysmon/Operational by default.
# The sourcetype override was ignored by the forwarder (events still arrive as
# XmlWinEventLog); the source override alone is sufficient for parsing.
[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
renderXml = true
index = sysmon
source = XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
sourcetype = XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
